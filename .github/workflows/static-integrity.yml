name: Static integrity checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "phase-1/**"

permissions:
  contents: read

jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static integrity tests
        run: node --test tests/*.test.mjs
