<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc"><title id="title">Shared electrons in water</title><desc id="desc">One oxygen and two hydrogens form a bent water molecule. Two dots in each O–H bond represent a shared pair; two further pairs near oxygen are lone pairs. Eight valence electrons in total. Dots are schematic, not fixed positions; sizes and distances are not to scale.</desc><rect width="320" height="240" rx="16" fill="#faf9f2"/><g stroke="#77608e" stroke-width="4"><path d="M160 100L80 162M160 100L240 162"/></g><g fill="#eadff2" stroke="#49305f" stroke-width="2"><circle cx="160" cy="100" r="25"/><circle cx="80" cy="162" r="22" fill="#fffdf9"/><circle cx="240" cy="162" r="22" fill="#fffdf9"/></g><g font-family="system-ui,sans-serif" font-size="28" text-anchor="middle" fill="#2c352a"><text x="160" y="110">O</text><text x="80" y="172">H</text><text x="240" y="172">H</text></g><g fill="#245c39" stroke="#fffdf9" stroke-width="1"><circle class="valence-electron" cx="116" cy="126" r="4"/><circle class="valence-electron" cx="124" cy="136" r="4"/><circle class="valence-electron" cx="196" cy="136" r="4"/><circle class="valence-electron" cx="204" cy="126" r="4"/><circle class="valence-electron" cx="145" cy="62" r="4"/><circle class="valence-electron" cx="155" cy="62" r="4"/><circle class="valence-electron" cx="196" cy="86" r="4"/><circle class="valence-electron" cx="196" cy="96" r="4"/></g><text x="160" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#2c352a">2 bonds · 2 lone pairs</text></svg>