<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 330" role="img" aria-labelledby="title desc"><title id="title">Compare elements, isotopes and ions</title><desc id="desc">Carbon versus oxygen: different proton counts. Oxygen-16 versus oxygen-18: same eight protons, different neutrons. Sodium atom versus sodium ion: same eleven protons, eleven versus ten electrons. Count cards, not transformations or scale drawings.</desc><g font-family="system-ui,sans-serif" font-size="24" fill="#2c352a"><g transform="translate(0 0)"><rect x="2" y="2" width="316" height="104" rx="12" fill="#faf9f2" stroke="#77608e"/><text x="16" y="29" font-weight="700">Element</text><text x="16" y="61">Carbon: 6 protons</text><text x="16" y="91">Oxygen: 8 protons</text></g><g transform="translate(0 110)"><rect x="2" y="2" width="316" height="104" rx="12" fill="#faf9f2" stroke="#77608e"/><text x="16" y="29" font-weight="700">Isotope</text><text x="16" y="61">O-16: 8p + 8n</text><text x="16" y="91">O-18: 8p + 10n</text></g><g transform="translate(0 220)"><rect x="2" y="2" width="316" height="104" rx="12" fill="#faf9f2" stroke="#77608e"/><text x="16" y="29" font-weight="700">Ion</text><text x="16" y="61">Na: 11p + 11e</text><text x="16" y="91">Na⁺: 11p + 10e</text></g></g></svg>