<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" role="img" aria-labelledby="title desc"><title id="title">Particle counts: what changes?</title><desc id="desc">Each particle symbol is a count key, not an individual atom picture. Carbon versus oxygen: six versus eight protons. Oxygen-16 versus oxygen-18: eight protons each; eight versus ten neutrons. Sodium versus sodium ion: eleven protons each; eleven versus ten electrons. No reaction or scale is depicted.</desc><g font-family="system-ui,sans-serif" font-size="24" fill="#2c352a"><g transform="translate(0 0)"><rect x="2" y="2" width="316" height="154" rx="12" fill="#faf9f2" stroke="#77608e"/><text x="12" y="30" font-weight="700">Different element</text><text x="12" y="62">Carbon</text><text x="170" y="62">Oxygen</text><g transform="translate(12 92)"><circle cx="14" cy="-7" r="15" fill="#eadff2" stroke="#49305f"/><text x="14" text-anchor="middle" font-size="24">p⁺</text><text x="39">× 6</text></g><g transform="translate(170 92)"><circle cx="14" cy="-7" r="15" fill="#eadff2" stroke="#49305f"/><text x="14" text-anchor="middle" font-size="24">p⁺</text><text x="39">× 8</text></g></g><g transform="translate(0 160)"><rect x="2" y="2" width="316" height="154" rx="12" fill="#faf9f2" stroke="#77608e"/><text x="12" y="30" font-weight="700">Different isotope</text><text x="12" y="62">Oxygen-16</text><text x="170" y="62">Oxygen-18</text><g transform="translate(12 92)"><circle cx="14" cy="-7" r="15" fill="#eadff2" stroke="#49305f"/><text x="14" text-anchor="middle" font-size="24">p⁺</text><text x="39">× 8</text></g><g transform="translate(170 92)"><circle cx="14" cy="-7" r="15" fill="#eadff2" stroke="#49305f"/><text x="14" text-anchor="middle" font-size="24">p⁺</text><text x="39">× 8</text></g><g transform="translate(12 131)"><circle cx="14" cy="-7" r="15" fill="#edf2df" stroke="#49305f"/><text x="14" text-anchor="middle" font-size="24">n⁰</text><text x="39">× 8</text></g><g transform="translate(170 131)"><circle cx="14" cy="-7" r="15" fill="#edf2df" stroke="#49305f"/><text x="14" text-anchor="middle" font-size="24">n⁰</text><text x="39">× 10</text></g></g><g transform="translate(0 320)"><rect x="2" y="2" width="316" height="154" rx="12" fill="#faf9f2" stroke="#77608e"/><text x="12" y="30" font-weight="700">Different charge</text><text x="12" y="62">Na</text><text x="170" y="62">Na⁺</text><g transform="translate(12 92)"><circle cx="14" cy="-7" r="15" fill="#eadff2" stroke="#49305f"/><text x="14" text-anchor="middle" font-size="24">p⁺</text><text x="39">× 11</text></g><g transform="translate(170 92)"><circle cx="14" cy="-7" r="15" fill="#eadff2" stroke="#49305f"/><text x="14" text-anchor="middle" font-size="24">p⁺</text><text x="39">× 11</text></g><g transform="translate(12 131)"><circle cx="14" cy="-7" r="15" fill="#fffdf9" stroke="#49305f"/><text x="14" text-anchor="middle" font-size="24">e⁻</text><text x="39">× 11</text></g><g transform="translate(170 131)"><circle cx="14" cy="-7" r="15" fill="#fffdf9" stroke="#49305f"/><text x="14" text-anchor="middle" font-size="24">e⁻</text><text x="39">× 10</text></g></g></g></svg>