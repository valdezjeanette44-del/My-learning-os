<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" role="img" aria-labelledby="title desc"><title id="title">Water formation conserves atoms</title><desc id="desc">Reactants: two H2 molecules and one O2 molecule. Products: two H2O molecules. Each side has four hydrogen atoms and two oxygen atoms. Overall bookkeeping, not a single-step mechanism. Schematic, not to scale.</desc><rect width="320" height="340" rx="16" fill="#faf7f0"/><g fill="#2c352a" font-family="Arial,sans-serif"><text x="16" y="32" font-size="24">Reactants: 2H₂ + O₂</text><path d="M35 77h40" stroke="#634783" stroke-width="4"/><g class="atom-H"><circle cx="35" cy="77" r="18" fill="#f5eee1" stroke="#50683d" stroke-width="2"/><text x="35" y="85" text-anchor="middle" font-size="24">H</text></g><g class="atom-H"><circle cx="75" cy="77" r="18" fill="#f5eee1" stroke="#50683d" stroke-width="2"/><text x="75" y="85" text-anchor="middle" font-size="24">H</text></g><path d="M130 77h40" stroke="#634783" stroke-width="4"/><g class="atom-H"><circle cx="130" cy="77" r="18" fill="#f5eee1" stroke="#50683d" stroke-width="2"/><text x="130" y="85" text-anchor="middle" font-size="24">H</text></g><g class="atom-H"><circle cx="170" cy="77" r="18" fill="#f5eee1" stroke="#50683d" stroke-width="2"/><text x="170" y="85" text-anchor="middle" font-size="24">H</text></g><path d="M235 77h40" stroke="#634783" stroke-width="4"/><g class="atom-O"><circle cx="235" cy="77" r="18" fill="#dce8cf" stroke="#50683d" stroke-width="2"/><text x="235" y="85" text-anchor="middle" font-size="24">O</text></g><g class="atom-O"><circle cx="275" cy="77" r="18" fill="#dce8cf" stroke="#50683d" stroke-width="2"/><text x="275" y="85" text-anchor="middle" font-size="24">O</text></g><text x="160" y="133" text-anchor="middle" font-size="24">4 H · 2 O</text><path d="M160 150v34m-10-10 10 10 10-10" fill="none" stroke="#634783" stroke-width="3"/><text x="16" y="217" font-size="24">Products: 2H₂O</text><path d="M57 278L85 250L113 278" fill="none" stroke="#634783" stroke-width="4"/><g class="atom-O"><circle cx="85" cy="250" r="18" fill="#dce8cf" stroke="#50683d" stroke-width="2"/><text x="85" y="258" text-anchor="middle" font-size="24">O</text></g><g class="atom-H"><circle cx="57" cy="278" r="18" fill="#f5eee1" stroke="#50683d" stroke-width="2"/><text x="57" y="286" text-anchor="middle" font-size="24">H</text></g><g class="atom-H"><circle cx="113" cy="278" r="18" fill="#f5eee1" stroke="#50683d" stroke-width="2"/><text x="113" y="286" text-anchor="middle" font-size="24">H</text></g><path d="M207 278L235 250L263 278" fill="none" stroke="#634783" stroke-width="4"/><g class="atom-O"><circle cx="235" cy="250" r="18" fill="#dce8cf" stroke="#50683d" stroke-width="2"/><text x="235" y="258" text-anchor="middle" font-size="24">O</text></g><g class="atom-H"><circle cx="207" cy="278" r="18" fill="#f5eee1" stroke="#50683d" stroke-width="2"/><text x="207" y="286" text-anchor="middle" font-size="24">H</text></g><g class="atom-H"><circle cx="263" cy="278" r="18" fill="#f5eee1" stroke="#50683d" stroke-width="2"/><text x="263" y="286" text-anchor="middle" font-size="24">H</text></g><text x="160" y="328" text-anchor="middle" font-size="24">4 H · 2 O</text></g></svg>