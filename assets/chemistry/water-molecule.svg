<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img" aria-labelledby="title desc"><title id="title">One water molecule: H2O</title><desc id="desc">One oxygen O is bonded to two hydrogen H atoms in a bent arrangement. Lines depict bonds within the molecule. Colours and sizes are conventions; not to scale.</desc><rect width="360" height="190" rx="16" fill="#faf9f2"/><g transform="translate(180 70) scale(2)"><g id="molecule"><g stroke="#49305f" stroke-width="5"><path d="M0 0L-22 17M0 0L22 17"/></g><circle r="13" fill="#79559c" stroke="#302a25" stroke-width="2"/><circle cx="-22" cy="17" r="9" fill="#fffdf9" stroke="#302a25" stroke-width="2"/><circle cx="22" cy="17" r="9" fill="#fffdf9" stroke="#302a25" stroke-width="2"/></g><g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle"><text y="4" fill="#fff">O</text><text x="-22" y="21" fill="#302a25">H</text><text x="22" y="21" fill="#302a25">H</text></g></g></svg>