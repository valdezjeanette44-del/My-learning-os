<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-labelledby="title desc"><title id="title">Invisible water vapour</title><desc id="desc">Six selected intact bent H2O molecules. Widely spaced arrangement. Not equal-volume samples; not to scale. Lines are bonds within molecules, not attractions between them.</desc><rect width="360" height="200" rx="16" fill="#faf9f2"/><defs><g id="molecule"><g stroke="#49305f" stroke-width="5"><path d="M0 0L-22 17M0 0L22 17"/></g><circle r="13" fill="#79559c" stroke="#302a25" stroke-width="2"/><circle cx="-22" cy="17" r="9" fill="#fffdf9" stroke="#302a25" stroke-width="2"/><circle cx="22" cy="17" r="9" fill="#fffdf9" stroke="#302a25" stroke-width="2"/></g></defs><use href="#molecule" transform="translate(45 45) scale(.65)"/><use href="#molecule" transform="translate(300 45) scale(.65)"/><use href="#molecule" transform="translate(175 85) scale(.65)"/><use href="#molecule" transform="translate(50 145) scale(.65)"/><use href="#molecule" transform="translate(300 145) scale(.65)"/><use href="#molecule" transform="translate(180 165) scale(.65)"/></svg>