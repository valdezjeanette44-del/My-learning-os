<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc"><title id="title">Schematic atomic structure</title><desc id="desc">A central nucleus contains positive protons and neutral neutrons. Negative electrons occupy the surrounding region. Symbol counts are illustrative, not a particular element. Sizes and distances are not to scale; the cloud is not a fixed path.</desc><rect width="320" height="240" rx="16" fill="#faf9f2"/><ellipse cx="160" cy="120" rx="132" ry="99" fill="#edf2df" stroke="#6b775f" stroke-dasharray="4 6"/><g fill="#79559c" stroke="#49305f" stroke-width="2"><circle cx="147" cy="110" r="18"/><circle cx="173" cy="133" r="18"/></g><g fill="#fffdf9" stroke="#49305f" stroke-width="2"><circle cx="176" cy="104" r="18"/><circle cx="144" cy="140" r="18"/></g><g font-family="system-ui,sans-serif" font-size="24" text-anchor="middle"><g fill="#fff"><text x="147" y="118">+</text><text x="173" y="141">+</text></g><text x="176" y="112">0</text><text x="144" y="148">0</text><g fill="#fffdf9" stroke="#49305f" stroke-width="2"><circle cx="65" cy="80" r="18"/><circle cx="254" cy="165" r="18"/></g><text x="65" y="88">−</text><text x="254" y="173">−</text></g></svg>