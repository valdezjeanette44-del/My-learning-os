<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" role="img" aria-labelledby="title desc"><title id="title">From ion counts to a salt lattice</title><desc id="desc">Count example: neutral sodium has eleven electrons, neutral chlorine seventeen. One electron transfers from sodium to chlorine; sodium ion then has ten electrons, chloride eighteen. Their nuclei are unchanged. A two-dimensional slice of a three-dimensional lattice shows six Na+ and six Cl− ions alternating; not separate NaCl molecules or a full reaction. Not to scale.</desc><rect width="320" height="480" rx="16" fill="#faf9f2"/><g font-family="system-ui,sans-serif" font-size="24" fill="#2c352a"><text x="12" y="30" font-weight="700">Electron counts</text><text x="12" y="67">Na: 11e⁻</text><text x="182" y="67">Cl: 17e⁻</text><path d="M65 104H250l-12 -7m12 7-12 7" fill="none" stroke="#49305f" stroke-width="3"/><text x="160" y="95" text-anchor="middle">1e⁻</text><text x="12" y="150">Na⁺: 10e⁻</text><text x="175" y="150">Cl⁻: 18e⁻</text><text x="12" y="203" font-weight="700">Ions attract in a lattice</text><g transform="translate(40 280)"><circle r="27" fill="#eadff2" stroke="#49305f" stroke-width="2"/><text text-anchor="middle" y="8">Na⁺</text></g><g transform="translate(120 280)"><circle r="27" fill="#edf2df" stroke="#49305f" stroke-width="2"/><text text-anchor="middle" y="8">Cl⁻</text></g><g transform="translate(200 280)"><circle r="27" fill="#eadff2" stroke="#49305f" stroke-width="2"/><text text-anchor="middle" y="8">Na⁺</text></g><g transform="translate(280 280)"><circle r="27" fill="#edf2df" stroke="#49305f" stroke-width="2"/><text text-anchor="middle" y="8">Cl⁻</text></g><g transform="translate(40 350)"><circle r="27" fill="#edf2df" stroke="#49305f" stroke-width="2"/><text text-anchor="middle" y="8">Cl⁻</text></g><g transform="translate(120 350)"><circle r="27" fill="#eadff2" stroke="#49305f" stroke-width="2"/><text text-anchor="middle" y="8">Na⁺</text></g><g transform="translate(200 350)"><circle r="27" fill="#edf2df" stroke="#49305f" stroke-width="2"/><text text-anchor="middle" y="8">Cl⁻</text></g><g transform="translate(280 350)"><circle r="27" fill="#eadff2" stroke="#49305f" stroke-width="2"/><text text-anchor="middle" y="8">Na⁺</text></g><g transform="translate(40 420)"><circle r="27" fill="#eadff2" stroke="#49305f" stroke-width="2"/><text text-anchor="middle" y="8">Na⁺</text></g><g transform="translate(120 420)"><circle r="27" fill="#edf2df" stroke="#49305f" stroke-width="2"/><text text-anchor="middle" y="8">Cl⁻</text></g><g transform="translate(200 420)"><circle r="27" fill="#eadff2" stroke="#49305f" stroke-width="2"/><text text-anchor="middle" y="8">Na⁺</text></g><g transform="translate(280 420)"><circle r="27" fill="#edf2df" stroke="#49305f" stroke-width="2"/><text text-anchor="middle" y="8">Cl⁻</text></g></g></svg>