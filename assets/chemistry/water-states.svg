<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" role="img" aria-labelledby="title desc"><title id="title">Water molecules across states</title><desc id="desc">Selected intact H2O molecules in ice, liquid and vapour; not equal-volume samples, not to scale.</desc><svg x="0" y="0" width="360" height="200" viewBox="0 0 360 200"><title id="title0">Ice</title><desc id="desc0">Six selected intact bent H2O molecules. Ordered open arrangement. Not equal-volume samples; not to scale. Lines are bonds within molecules, not attractions between them.</desc><rect width="360" height="200" rx="16" fill="#faf9f2"/><defs><g id="molecule0"><g stroke="#49305f" stroke-width="5"><path d="M0 0L-22 17M0 0L22 17"/></g><circle r="13" fill="#79559c" stroke="#302a25" stroke-width="2"/><circle cx="-22" cy="17" r="9" fill="#fffdf9" stroke="#302a25" stroke-width="2"/><circle cx="22" cy="17" r="9" fill="#fffdf9" stroke="#302a25" stroke-width="2"/></g></defs><use href="#molecule0" transform="translate(95 65) scale(.65)"/><use href="#molecule0" transform="translate(180 65) scale(.65)"/><use href="#molecule0" transform="translate(265 65) scale(.65)"/><use href="#molecule0" transform="translate(95 130) scale(.65)"/><use href="#molecule0" transform="translate(180 130) scale(.65)"/><use href="#molecule0" transform="translate(265 130) scale(.65)"/></svg><svg x="0" y="200" width="360" height="200" viewBox="0 0 360 200"><title id="title1">Liquid water</title><desc id="desc1">Six selected intact bent H2O molecules. Close irregular arrangement. Not equal-volume samples; not to scale. Lines are bonds within molecules, not attractions between them.</desc><rect width="360" height="200" rx="16" fill="#faf9f2"/><defs><g id="molecule1"><g stroke="#49305f" stroke-width="5"><path d="M0 0L-22 17M0 0L22 17"/></g><circle r="13" fill="#79559c" stroke="#302a25" stroke-width="2"/><circle cx="-22" cy="17" r="9" fill="#fffdf9" stroke="#302a25" stroke-width="2"/><circle cx="22" cy="17" r="9" fill="#fffdf9" stroke="#302a25" stroke-width="2"/></g></defs><use href="#molecule1" transform="translate(100 65) scale(.65)"/><use href="#molecule1" transform="translate(170 70) scale(.65)"/><use href="#molecule1" transform="translate(240 60) scale(.65)"/><use href="#molecule1" transform="translate(90 120) scale(.65)"/><use href="#molecule1" transform="translate(160 125) scale(.65)"/><use href="#molecule1" transform="translate(230 115) scale(.65)"/></svg><svg x="0" y="400" width="360" height="200" viewBox="0 0 360 200"><title id="title2">Invisible water vapour</title><desc id="desc2">Six selected intact bent H2O molecules. Widely spaced arrangement. Not equal-volume samples; not to scale. Lines are bonds within molecules, not attractions between them.</desc><rect width="360" height="200" rx="16" fill="#faf9f2"/><defs><g id="molecule2"><g stroke="#49305f" stroke-width="5"><path d="M0 0L-22 17M0 0L22 17"/></g><circle r="13" fill="#79559c" stroke="#302a25" stroke-width="2"/><circle cx="-22" cy="17" r="9" fill="#fffdf9" stroke="#302a25" stroke-width="2"/><circle cx="22" cy="17" r="9" fill="#fffdf9" stroke="#302a25" stroke-width="2"/></g></defs><use href="#molecule2" transform="translate(45 45) scale(.65)"/><use href="#molecule2" transform="translate(300 45) scale(.65)"/><use href="#molecule2" transform="translate(175 85) scale(.65)"/><use href="#molecule2" transform="translate(50 145) scale(.65)"/><use href="#molecule2" transform="translate(300 145) scale(.65)"/><use href="#molecule2" transform="translate(180 165) scale(.65)"/></svg></svg>