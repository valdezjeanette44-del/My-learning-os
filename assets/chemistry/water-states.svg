<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" role="img" aria-labelledby="title desc"><title id="title">Water molecules in ice, liquid and vapour</title><desc id="desc">Six identical H2O symbols in each panel: ordered and open in ice, close and irregular in liquid, widely spaced in vapour. Panels show selected molecules, not equal-volume samples. Motion marks are schematic. Not to scale; molecules do not grow during phase changes.</desc><rect width="360" height="600" rx="16" fill="#faf9f2"/><g font-family="system-ui,sans-serif" fill="#29362a"><text x="180" y="30" text-anchor="middle" font-size="26" font-weight="700">Ice</text><rect x="14" y="42" width="332" height="130" rx="10" fill="#edf2df" stroke="#6b775f"/><text x="100" y="90" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="180" y="90" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="260" y="90" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="100" y="140" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="180" y="140" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="260" y="140" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text></g><g font-family="system-ui,sans-serif" fill="#29362a"><text x="180" y="220" text-anchor="middle" font-size="26" font-weight="700">Liquid water</text><rect x="14" y="232" width="332" height="130" rx="10" fill="#edf2df" stroke="#6b775f"/><text x="120" y="275" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="177" y="280" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="234" y="270" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="110" y="320" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="168" y="325" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="226" y="315" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text></g><g font-family="system-ui,sans-serif" fill="#29362a"><text x="180" y="410" text-anchor="middle" font-size="26" font-weight="700">Water vapour</text><rect x="14" y="422" width="332" height="130" rx="10" fill="#edf2df" stroke="#6b775f"/><text x="55" y="450" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="290" y="445" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="180" y="480" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="65" y="525" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="285" y="525" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text><text x="170" y="545" text-anchor="middle" font-size="26" fill="#49305f">H₂O</text></g><g stroke="#526b40" fill="none" stroke-width="2"><path d="M90 98l4 3-4 3m80-6l4 3-4 3M100 290h15m90 45h15M40 465l-12 10m270-10l18 9"/></g></svg>