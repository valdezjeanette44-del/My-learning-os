<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
<title id="title">Typical bacterial and animal cells</title><desc id="desc">Both cells have a membrane, cytoplasm, DNA and ribosomes. Bacterial DNA is not enclosed in a nucleus. Most animal-cell DNA is enclosed in a nucleus. The bacterial wall is outside its membrane. Simplified, not to scale.</desc>
