<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
<title id="title">Membrane exchange: two passive routes</title><desc id="desc">Outside is above the membrane; inside is below. Oxygen crosses the lipid layer directly. An ion enters through a suitable protein channel. Arrows indicate net entry under the stated gradients, not pumping. Simplified, not to scale.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#4d6737"/></marker></defs>
<rect width="360" height="560" rx="18" fill="#faf9f2"/><rect x="12" y="245" width="336" height="90" fill="#d9c7e5"/><rect x="235" y="232" width="62" height="116" rx="12" fill="#597046"/><rect x="257" y="232" width="18" height="116" fill="#faf9f2"/>
<g font-family="system-ui,sans-serif" fill="#29362a" font-size="19"><text x="22" y="40" font-weight="700">Outside the cell</text><text x="22" y="90">Oxygen: higher concentration</text><text x="22" y="120">outside than inside</text><text x="40" y="205">Oxygen</text><text x="242" y="205">Ion +</text><text x="22" y="405" font-weight="700">Inside the cell</text><text x="22" y="448">Lipid layer</text><text x="22" y="482">Selective protein channel</text><text x="22" y="528" font-size="17">Arrows: assumed net inward movement</text></g>
<g stroke="#4d6737" stroke-width="4" marker-end="url(#arrow)"><path d="M87 217V375"/><path d="M266 217V375"/></g><circle cx="87" cy="230" r="8" fill="#77994e"/><circle cx="266" cy="230" r="8" fill="#9665b4"/>
<g stroke="#56624e" stroke-width="2" fill="none"><path d="M125 442H175V335"/><path d="M280 473H320V290H297"/></g>
</svg>
