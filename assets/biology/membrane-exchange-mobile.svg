<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-labelledby="title desc">
<title id="title">Membrane exchange: two passive routes</title>
<desc id="desc">Outside is above the membrane; inside is below. Oxygen is more concentrated outside than inside and crosses the lipid layer directly. An ion enters through a suitable selective protein channel. Arrows indicate net entry under the stated gradients, not pumping. Simplified, not to scale.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#4d6737"/></marker></defs>
<rect width="320" height="400" rx="18" fill="#faf9f2"/>
<rect x="12" y="145" width="296" height="64" fill="#d9c7e5"/>
<rect x="220" y="135" width="60" height="84" rx="12" fill="#597046"/><rect x="242" y="135" width="16" height="84" fill="#faf9f2"/>
<g stroke="#4d6737" stroke-width="4" marker-end="url(#arrow)"><path d="M80 132V235"/><path d="M250 132V235"/></g>
<circle cx="80" cy="142" r="7" fill="#77994e"/><circle cx="250" cy="142" r="7" fill="#9665b4"/>
<g stroke="#56624e" stroke-width="2" fill="none"><path d="M150 292H180V209"/><path d="M200 326H300V177H280"/></g>
<g font-family="system-ui,sans-serif" fill="#29362a" font-size="24">
<text x="16" y="30" font-weight="700">Outside the cell</text>
<text x="16" y="60">More oxygen outside</text><text x="16" y="88">than inside</text>
<text x="36" y="122">Oxygen</text><text x="222" y="122">Ion +</text>
<text x="16" y="264" font-weight="700">Inside the cell</text>
<text x="16" y="298">Lipid layer</text><text x="16" y="332">Protein channel</text>
<text x="16" y="366">Arrows: net entry</text><text x="16" y="392">under stated gradients</text>
</g>
</svg>
