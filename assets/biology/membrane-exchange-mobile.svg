<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-labelledby="title desc">
<title id="title">Membrane exchange: two passive routes</title><desc id="desc">Outside is above the membrane; inside is below. Oxygen crosses the lipid layer directly. An ion enters through a suitable protein channel. Arrows indicate net entry under the stated gradients, not pumping. Simplified, not to scale.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#4d6737"/></marker></defs>
<rect width="360" height="440" rx="18" fill="#faf9f2"/><rect x="12" y="154" width="336" height="70" fill="#d9c7e5"/><rect x="235" y="144" width="62" height="90" rx="12" fill="#597046"/><rect x="257" y="144" width="18" height="90" fill="#faf9f2"/>
<g font-family="system-ui,sans-serif" fill="#29362a" font-size="19"><text x="20" y="30" font-weight="700">Outside the cell</text><text x="20" y="63">Oxygen: higher concentration</text><text x="20" y="89">outside than inside</text><text x="43" y="126">Oxygen</text><text x="240" y="126">Ion +</text><text x="20" y="280" font-weight="700">Inside the cell</text><text x="20" y="316">Lipid layer</text><text x="20" y="350">Selective protein channel</text><text x="20" y="389">Arrows: assumed net</text><text x="20" y="416">inward movement</text></g>
<g stroke="#4d6737" stroke-width="4" marker-end="url(#arrow)"><path d="M87 135V249"/><path d="M266 135V249"/></g><circle cx="87" cy="146" r="7" fill="#77994e"/><circle cx="266" cy="146" r="7" fill="#9665b4"/>
<g stroke="#56624e" stroke-width="2" fill="none"><path d="M128 310H175V224"/><path d="M279 344H325V190H297"/></g>
</svg>
