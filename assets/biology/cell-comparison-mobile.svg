<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 580" role="img" aria-labelledby="title desc">
<title id="title">Typical bacterium and animal cell, compact stacked comparison</title><desc id="desc">Bacterial DNA has no nuclear membrane. A wall surrounds its cell membrane. In the animal cell, a nucleus encloses most DNA. Both have cytoplasm and ribosomes. Numbered pointers identify the structures in the key below each cell. Simplified, not to scale.</desc>
<rect width="360" height="580" rx="18" fill="#faf9f2"/>
<rect x="26" y="48" width="270" height="116" rx="55" fill="#dfe9cb" stroke="#526b40" stroke-width="4"/><rect x="36" y="58" width="250" height="96" rx="45" fill="#edf2df" stroke="#526b40" stroke-width="3"/>
<path d="M88 106q30-40 60 0t60 0q-30 36-60 0t-60 0" fill="none" stroke="#79559c" stroke-width="4"/>
<circle cx="153" cy="353" r="70" fill="#eee6f3" stroke="#6a507e" stroke-width="4"/><circle cx="153" cy="353" r="28" fill="#d4bfe2" stroke="#6a507e" stroke-width="3"/><path d="M137 352q8-18 16 0t16 0" fill="none" stroke="#694285" stroke-width="4"/>
<g fill="#536941"><circle cx="68" cy="88" r="4"/><circle cx="120" cy="137" r="4"/><circle cx="244" cy="95" r="4"/><circle cx="115" cy="327" r="4"/><circle cx="197" cy="354" r="4"/><circle cx="131" cy="397" r="4"/></g>
<g stroke="#58634e" stroke-width="2" fill="none"><path d="M305 73H260L200 103"/><path d="M305 112H286"/><path d="M305 151H291"/><path d="M265 325H230L181 353"/><path d="M265 388H215"/></g>
<g font-family="system-ui,sans-serif" fill="#29362a" font-size="19"><text x="20" y="30" font-weight="700">Typical bacterium</text><text x="315" y="79">1</text><text x="315" y="118">2</text><text x="315" y="157">3</text><text x="20" y="195">1 DNA: no nuclear membrane</text><text x="20" y="223">2 Cell membrane (inner)</text><text x="20" y="251">3 Cell wall (outer)</text><text x="20" y="280" font-weight="700">Typical animal cell</text><text x="275" y="331">4</text><text x="275" y="394">5</text><text x="20" y="455">4 Nucleus: encloses most DNA</text><text x="20" y="483">5 Cell membrane: outer edge</text><text x="20" y="526">Both: cytoplasm inside</text><text x="20" y="554">Dots: ribosomes</text></g>
</svg>
