<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 530" role="img" aria-labelledby="title desc">
<title id="title">Typical bacterium and animal cell, compact stacked comparison</title>
<desc id="desc">Bacterial DNA has no nuclear membrane. A cell wall surrounds its cell membrane. In the animal cell, a nucleus encloses most DNA. Both have cytoplasm and ribosomes. Numbered pointers identify the structures in the key below each cell. Simplified, not to scale.</desc>
<rect width="320" height="530" rx="18" fill="#faf9f2"/>
<rect x="24" y="52" width="224" height="94" rx="45" fill="#dfe9cb" stroke="#526b40" stroke-width="4"/>
<rect x="32" y="60" width="208" height="78" rx="38" fill="#edf2df" stroke="#526b40" stroke-width="3"/>
<path d="M74 100q24-30 48 0t48 0q-24 26-48 0t-48 0" fill="none" stroke="#79559c" stroke-width="4"/>
<circle cx="108" cy="346" r="54" fill="#eee6f3" stroke="#6a507e" stroke-width="4"/>
<circle cx="108" cy="346" r="22" fill="#d4bfe2" stroke="#6a507e" stroke-width="3"/>
<path d="M96 346q6-15 12 0t12 0" fill="none" stroke="#694285" stroke-width="4"/>
<g fill="#536941"><circle cx="60" cy="80" r="4"/><circle cx="104" cy="126" r="4"/><circle cx="220" cy="82" r="4"/><circle cx="75" cy="326" r="4"/><circle cx="146" cy="348" r="4"/><circle cx="93" cy="382" r="4"/></g>
<g stroke="#58634e" stroke-width="2" fill="none"><path d="M270 67H220L122 100"/><path d="M270 102H240"/><path d="M270 139H240L220 143"/><path d="M240 315H184L130 346"/><path d="M240 375H179L153 375"/></g>
<g font-family="system-ui,sans-serif" fill="#29362a" font-size="24">
<text x="16" y="30" font-weight="700">Typical bacterium</text>
<text x="278" y="75">1</text><text x="278" y="110">2</text><text x="278" y="147">3</text>
<text x="16" y="180">1 DNA: not in a nucleus</text><text x="16" y="210">2 Cell membrane</text><text x="16" y="240">3 Cell wall</text>
<text x="16" y="276" font-weight="700">Typical animal cell</text>
<text x="251" y="323">4</text><text x="251" y="383">5</text>
<text x="16" y="424">4 Nucleus: most DNA</text><text x="16" y="454">5 Cell membrane</text>
<text x="16" y="488">Both: cytoplasm inside</text><text x="16" y="514">Dots: ribosomes</text>
</g>
</svg>
