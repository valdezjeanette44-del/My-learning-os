<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" role="img" aria-labelledby="title desc">
<title id="title">Typical bacterium and animal cell, stacked comparison</title><desc id="desc">Bacterial DNA has no nuclear membrane. A wall surrounds its cell membrane. In the animal cell, a nucleus encloses most DNA. Both have cytoplasm and ribosomes. Simplified, not to scale.</desc>
<rect width="360" height="760" rx="18" fill="#faf9f2"/>
<rect x="42" y="65" width="276" height="136" rx="65" fill="#dfe9cb" stroke="#526b40" stroke-width="4"/><rect x="53" y="76" width="254" height="114" rx="55" fill="#edf2df" stroke="#526b40" stroke-width="3"/>
<path d="M103 134q32-50 69 0t72 0q-32 45-68 0t-73 0" fill="none" stroke="#79559c" stroke-width="4"/>
<circle cx="180" cy="472" r="92" fill="#eee6f3" stroke="#6a507e" stroke-width="4"/><circle cx="180" cy="472" r="37" fill="#d4bfe2" stroke="#6a507e" stroke-width="3"/><path d="M160 470q10-24 20 0t20 0" fill="none" stroke="#694285" stroke-width="4"/>
<g fill="#536941"><circle cx="85" cy="120" r="4"/><circle cx="137" cy="170" r="4"/><circle cx="267" cy="123" r="4"/><circle cx="124" cy="440" r="4"/><circle cx="241" cy="470" r="4"/><circle cx="150" cy="534" r="4"/></g>
<g font-family="system-ui,sans-serif" fill="#29362a" font-size="19"><text x="26" y="37" font-weight="700">Typical bacterium</text><text x="26" y="241">DNA: no nuclear membrane</text><text x="26" y="285">Cell membrane (inner boundary)</text><text x="26" y="329">Cell wall (outer boundary)</text><text x="26" y="374" font-weight="700">Typical animal cell</text><text x="26" y="605">Nucleus: encloses most DNA</text><text x="26" y="649">Cell membrane: outer boundary</text><text x="26" y="704">Both: cytoplasm inside</text><text x="26" y="738">Dots: ribosomes</text></g>
<g stroke="#58634e" stroke-width="2" fill="none"><path d="M286 235H333V133H230"/><path d="M320 279H329V185H270"/><path d="M306 322H342V160H315"/><path d="M300 598H328V472H218"/><path d="M326 642H342V500H268"/></g>
</svg>
