<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="title desc">
<title id="title">A viable seed, seedling and enlarged cell</title>
<desc id="desc">A viable seed contains a living embryo and stored reserves. When germination requirements are satisfied, a root and shoot begin growing using reserves. Green seedling tissues can capture light to make sugars. A dashed callout enlarges one cell, not a later life stage. Simplified, not to scale; not every seed is viable.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#526b40"/></marker></defs>
<rect width="360" height="640" rx="16" fill="#faf9f2"/>
<g font-family="system-ui,sans-serif" fill="#29362a" font-size="24" text-anchor="middle"><text x="180" y="31" font-weight="700">1 Viable seed</text><text x="180" y="147">Living embryo + reserves</text><text x="180" y="209" font-weight="700">2 Germinating seed</text><text x="180" y="318">Early growth uses reserves</text><text x="180" y="380" font-weight="700">3 Growing seedling</text><text x="180" y="481">Green tissues use light</text><text x="180" y="509">to make sugars</text><text x="180" y="607">Enlarged cell inset</text><text x="180" y="634">Simplified, not to scale</text></g>
