<path d="M145 423H24V558H139" fill="none" stroke="#6d6377" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="139" y="533" width="82" height="50" rx="12" fill="#e0ebcf" stroke="#526b40" stroke-width="3"/><rect x="145" y="539" width="70" height="38" rx="9" fill="#f0f4e6" stroke="#526b40" stroke-width="2"/><circle cx="179" cy="557" r="9" fill="#d4bfe2" stroke="#79559c" stroke-width="2"/>
